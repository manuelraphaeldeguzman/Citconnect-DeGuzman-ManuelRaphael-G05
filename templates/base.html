
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Citconnect</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand" href="{% url 'dashboard' %}">
                Citconnect
            </a>

            <div class="navbar-nav ms-auto">

                {% if user.is_authenticated %}

                    <span class="nav-link text-white">
                        Hi, {{ user.username }}!
                    </span>

                    <a href="{% url 'profile' %}" class="nav-link text-white">
                        Edit Profile
                    </a>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-light btn-sm mt-1">
                            Log Out
                        </button>
                    </form>

                {% else %}

                    <a href="{% url 'login' %}" class="nav-link text-white">
                        Log In
                    </a>

                    <a href="{% url 'signup' %}" class="nav-link text-white">
                        Sign Up
                    </a>

                {% endif %}

            </div>
        </div>
    </nav>

    <main class="container mt-4">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success alert-dismissible fade show"
                     role="alert">

                    {{ message }}

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </main>

    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
