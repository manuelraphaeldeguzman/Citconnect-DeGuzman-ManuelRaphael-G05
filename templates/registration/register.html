{% extends "base.html" %}

{% block title %}CampusConnect - Sign Up{% endblock %}

{% block footer %}<p>&copy; 2023 CampusConnect. All rights reserved.</p>{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow p-4">
            <h2 class="text-center mb-4">Create Your Account</h2>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary w-100">
                    Sign Up
                </button>
            </form>

            <p class="text-center mt-3">
                Already have an account?
                <a href="{% url 'login' %}">Log in</a>
            </p>
        </div>

    </div>
</div>

{% endblock %}
